name: .NET

on:
  push:
  pull_request:

jobs:
  test-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test GLMS.sln --configuration Release
      - run: docker build --tag glms-web:${{ github.sha }} .